# Builds the site and publishes it to GitHub Pages about every 30 minutes, and whenever you change a file.
# One-time setup: repository Settings, Pages, Build and deployment, Source: "GitHub Actions".
#
# Design rules this file follows:
#  1. SAFETY CHECKS BLOCK PUBLISHING. If tests/test_safety.py fails, nothing is published. The last good version stays live and the page
#     itself says "Out of date" after about 3 hours. A stale, labelled page is the site's honest way of saying "I don't know".
#  2. The ordinary build has READ-ONLY repository permission. The one job that needs write permission (keeping the schedule alive)
#     lives in its own small file, keepalive.yml.
#  3. Runs are never cancelled half way (that can wedge GitHub Pages). New runs wait their turn.
#  4. Scheduled runs at the top of the hour are the most delayed, so this runs at 7 and 37 minutes past.
name: Build and publish
on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false      # never cancel a deployment half way: that can wedge GitHub Pages. New runs wait their turn instead.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the files are in the right folders (warnings only)
        continue-on-error: true
        run: |
          for f in tools/publish.py tools/build_site.py src/index.src.html editorial/baseline.json editorial/signals.json site.json official_sources.json tests/test_safety.py; do
            [ -f "$f" ] || echo "::error::Missing $f. It must be in exactly this folder."
          done
          for f in publish.py build_site.py test_publish.py test_safety.py index.src.html manifest.webmanifest signals.json; do
            [ -f "$f" ] && echo "::warning::Misplaced file $f at the top level of the repository. It belongs inside a folder, and this copy is not used. Delete it."
          done
          true
      - name: Safety checks (these MUST pass, otherwise nothing is published)
        id: safety
        run: python -m unittest discover -s tests -p "test_safety.py" -v
      - name: Explain a safety failure
        if: failure() && steps.safety.outcome == 'failure'
        run: echo "::error::A safety check failed, so the site was NOT updated. The last good version stays live and will say 'Out of date' after about 3 hours. Open the step above to see which check failed."
      - name: Wider self-checks (warnings only; a yellow warning here never stops the site publishing)
        continue-on-error: true
        run: python -m unittest discover -s tests -p "test_publish.py"
      - name: Build the site
        run: python tools/build_site.py
      - name: Keep a copy of the memory as a fallback (the site also publishes its own copy as state.json)
        uses: actions/cache@v4
        with:
          path: data
          key: wary-state-${{ github.run_id }}
          restore-keys: wary-state-
      - name: Fetch official sources and write feed.json
        run: python tools/publish.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Browser checks (only when the code changes, not on the 30-minute refresh)
        if: github.event_name == 'push'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m http.server 8770 --directory site &
          sleep 2
          python tests/browser_check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
