# Builds the site and publishes it to GitHub Pages every 30 minutes, and whenever you change a file.
# One-time setup: repository Settings, Pages, Build and deployment, Source: "GitHub Actions".
name: Build and publish
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the editorial files and run the tests
        run: python -m unittest discover -s tests
      - name: Build the site
        run: python tools/build_site.py
      - name: Remember when a level 5 trigger was first seen
        uses: actions/cache@v4
        with:
          path: data
          key: wary-state-${{ github.run_id }}
          restore-keys: wary-state-
      - name: Fetch official sources and write feed.json
        run: python tools/publish.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
